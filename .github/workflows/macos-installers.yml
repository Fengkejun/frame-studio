name: macOS installers

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare pinned FFmpeg sidecars
        run: bash scripts/prepare-macos-ffmpeg.sh
      - name: Build DMG
        run: npm run desktop:build
      - name: Inspect and launch bundled app
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_dir=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -quiet -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -quiet' EXIT
          app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          if ! smoke_output=$(npm run test:macos -- "$app" 2>&1); then
            echo "$smoke_output"
            annotation=$(printf '%s' "$smoke_output" | tail -n 20 | tr '\n' ' ')
            echo "::error title=macOS native smoke failed::$annotation"
            exit 1
          fi
          echo "$smoke_output"
      - uses: actions/upload-artifact@v4
        with:
          name: frame-studio-macos-${{ matrix.architecture }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
