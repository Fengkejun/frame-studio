[package]
name = "frame-studio"
version = "0.1.0"
description = "Frame Studio desktop workflow workspace"
authors = ["Frame Studio"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "frame_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "fs", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
rfd = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }
